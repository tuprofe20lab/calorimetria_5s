<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab: Equilibrio Térmico</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 0% { transform: translateY(105vh) rotate(0deg); } 100% { transform: translateY(-105vh) rotate(360deg); } }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(15px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes fadeInScale { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.18, 1.18, 1.18); }
            40% { transform: scale3d(.92, .92, .92); }
            60% { transform: scale3d(1.06, 1.06, 1.06); opacity: 1; }
            80% { transform: scale3d(.97, .97, .97); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }
        
        /* Animaciones Secuenciales del Gráfico */
        @keyframes traceArch { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
        @keyframes signFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes drawLine { 
            0% { stroke-dashoffset: 1500; } 
            100% { stroke-dashoffset: 0; } 
        }
        @keyframes signAppear { 
            0% { opacity: 0; transform: scale(0.3) translateY(20px); } 
            100% { opacity: 1; transform: scale(1) translateY(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }

        /* NUEVOS EFECTOS VISUALES LLAMATIVOS */
        @keyframes bgGradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-bg-gradient {
            background-size: 200% 200%;
            animation: bgGradientMove 10s ease infinite;
        }
        
        @keyframes pulseGlowCyan {
            0%, 100% { box-shadow: 0 0 12px rgba(6, 182, 212, 0.4), inset 0 0 8px rgba(6, 182, 212, 0.1); }
            50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.8), inset 0 0 12px rgba(6, 182, 212, 0.3); }
        }
        @keyframes pulseGlowYellow {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.5), inset 0 0 10px rgba(234, 179, 8, 0.2); }
            50% { box-shadow: 0 0 30px rgba(234, 179, 8, 1), inset 0 0 20px rgba(234, 179, 8, 0.5); }
        }
        .math-current-step { animation: pulseGlowCyan 2s infinite; border-color: #22d3ee !important; }
        .math-final-step { animation: pulseGlowYellow 2s infinite; border-color: #facc15 !important; background-color: #fef08a !important; }

        @keyframes dashFlow {
            to { stroke-dashoffset: -30; }
        }

        /* Ocultar scrollbars globalmente */
        .scrollbar-hide::-webkit-scrollbar { display: none !important; }
        .scrollbar-hide { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-fadeInScale { animation: fadeInScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.9rem, 1.8vw, 1.25rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(1.1rem, 2.2vw, 1.5rem) !important; color: #ffffff !important; text-shadow: 0 2px 4px rgba(0,0,0,0.5); white-space: normal; }
        .math-current .katex { font-size: clamp(1.2rem, 2.5vw, 2.2rem) !important; color: #0f172a !important; }
        .math-history .katex { font-size: clamp(0.9rem, 1.8vw, 1.6rem) !important; color: #475569 !important; }
        
        .math-container-single-line {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 0;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;
        const Activity = (p) => <Icon {...p} paths='<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' />;

        const AudioController = {
            ctx: null, muted: false, bgmNode: null,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            startBGM: function() {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                if (this.bgmNode) return;
                const mainGain = this.ctx.createGain();
                mainGain.gain.value = this.muted ? 0 : 0.08;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 800;
                filter.connect(mainGain); mainGain.connect(this.ctx.destination);
                this.bgmNode = { mainGain, filter, interval: null };
                const chords = [ [55, 60, 64, 71], [52, 57, 64, 71], [53, 57, 60, 64], [50, 55, 59, 64] ];
                let chordIndex = 0;
                const playChord = () => {
                    if (this.ctx.state !== 'running') return;
                    const chord = chords[chordIndex];
                    chordIndex = (chordIndex + 1) % chords.length;
                    chord.forEach((midi, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine'; osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
                        const now = this.ctx.currentTime; const delay = i * 0.2;
                        gain.gain.setValueAtTime(0, now + delay);
                        gain.gain.linearRampToValueAtTime(0.15, now + delay + 2);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 8);
                        osc.connect(gain); gain.connect(filter);
                        osc.start(now + delay); osc.stop(now + delay + 8);
                    });
                };
                playChord(); this.bgmNode.interval = setInterval(playChord, 6000);
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect(); const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { 
                this.muted = !this.muted; 
                if (this.bgmNode) this.bgmNode.mainGain.gain.setTargetAtTime(this.muted ? 0 : 0.08, this.ctx.currentTime, 0.1);
                return this.muted; 
            }
        };

        const MathDisplay = memo(({ latex, className = "", inline = false }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try { window.katex.render(latex, containerRef.current, { displayMode: !inline, throwOnError: false, strict: false, trust: true }); }
                    catch (e) { containerRef.current.innerText = latex; }
                }
            }, [latex, inline]);
            return inline ? <span ref={containerRef} className={`inline-block align-middle ${className}`} /> : <div className={`math-container-single-line ${className}`}><div ref={containerRef} className="w-full text-center" /></div>;
        });

        const DrawingCanvas = () => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [isDrawMode, setIsDrawMode] = useState(false);
            const [tool, setTool] = useState('pen');
            const [isSnapMode, setIsSnapMode] = useState(false);
            const [penColor, setPenColor] = useState('#ef4444');
            const [penWidth, setPenWidth] = useState(6);
            const penPointsRef = useRef([]);
            const activePointerRef = useRef(null);
            const savedImageRef = useRef(null);
            const startPosRef = useRef({ x: 0, y: 0 });
            const historyRef = useRef([]);

            const playPop = () => { AudioController.init(); AudioController.startBGM(); AudioController.play('pop'); };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !canvas.parentElement) return;
                const updateSize = (entries) => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        const ctx = canvas.getContext('2d');
                        let imgData = null;
                        if (canvas.width > 0 && canvas.height > 0) {
                            try { imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) {}
                        }
                        canvas.width = width; canvas.height = height;
                        if (imgData) ctx.putImageData(imgData, 0, 0);
                    }
                };
                const observer = new ResizeObserver(updateSize);
                observer.observe(canvas.parentElement);
                return () => observer.disconnect();
            }, []);

            const renderPen = (points, straight = false) => {
                const ctx = canvasRef.current.getContext('2d');
                ctx.putImageData(savedImageRef.current, 0, 0);
                const angle = -15 * Math.PI / 180;
                const c = Math.cos(angle), s = Math.sin(angle);
                const local = points.map(p => ({ x: c * p.x + s * p.y, y: (-s * p.x + c * p.y) / 0.5 }));
                ctx.save();
                ctx.transform(c, s, -0.5 * s, 0.5 * c, 0, 0);
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = penColor; ctx.fillStyle = penColor;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.moveTo(local[0].x, local[0].y);
                if (local.length === 1) {
                    ctx.arc(local[0].x, local[0].y, penWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    if (!straight) {
                        for (let i = 1; i < local.length - 1; i++) {
                            const midpoint = { x: (local[i].x + local[i + 1].x) / 2, y: (local[i].y + local[i + 1].y) / 2 };
                            ctx.quadraticCurveTo(local[i].x, local[i].y, midpoint.x, midpoint.y);
                        }
                    }
                    const last = local[local.length - 1];
                    ctx.lineTo(last.x, last.y);
                    ctx.stroke();
                }
                ctx.restore();
            };

            const startDrawing = (e) => {
                if (!isDrawMode || activePointerRef.current !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                
                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = tool === 'highlighter' ? 24 : penWidth;
                ctx.strokeStyle = tool === 'highlighter' ? `${penColor}4D` : penColor;
                ctx.globalCompositeOperation = tool === 'highlighter' ? 'multiply' : 'source-over';

                const startX = e.clientX - rect.left;
                const startY = e.clientY - rect.top;
                
                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
                startPosRef.current = { x: startX, y: startY };
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                penPointsRef.current = [{ x: startX, y: startY }];
                activePointerRef.current = e.pointerId;
                canvas.setPointerCapture(e.pointerId);
                if (tool === 'pen') renderPen(penPointsRef.current);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (activePointerRef.current !== e.pointerId || !isDrawMode) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                if (isSnapMode || e.shiftKey) {
                    ctx.putImageData(savedImageRef.current, 0, 0);
                    const dx = currentX - startPosRef.current.x;
                    const dy = currentY - startPosRef.current.y;
                    const angle = Math.atan2(dy, dx);
                    const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const snapX = startPosRef.current.x + Math.cos(snappedAngle) * dist;
                    const snapY = startPosRef.current.y + Math.sin(snappedAngle) * dist;
                    if (tool === 'pen') { renderPen([startPosRef.current, { x: snapX, y: snapY }], true); return; }
                    ctx.beginPath(); ctx.moveTo(startPosRef.current.x, startPosRef.current.y); ctx.lineTo(snapX, snapY); ctx.stroke();
                } else {
                    if (tool === 'pen') {
                        const events = e.nativeEvent?.getCoalescedEvents?.() || [];
                        const samples = events.length ? events : [e];
                        samples.forEach(sample => penPointsRef.current.push({ x: sample.clientX - rect.left, y: sample.clientY - rect.top }));
                        renderPen(penPointsRef.current); return;
                    }
                    if (tool === 'highlighter') ctx.putImageData(savedImageRef.current, 0, 0);
                    ctx.lineTo(currentX, currentY); ctx.stroke();
                }
            };

            const stopDrawing = () => {
                const canvas = canvasRef.current;
                const pointer = activePointerRef.current;
                activePointerRef.current = null;
                if (pointer !== null && canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
                if (isDrawing) { canvas.getContext('2d').closePath(); setIsDrawing(false); }
            };

            const selectTool = (nextTool) => {
                stopDrawing(); playPop();
                const enabled = nextTool !== 'selector' && !(isDrawMode && tool === nextTool);
                setIsDrawMode(enabled);
                if (nextTool !== 'selector') setTool(nextTool);
            };

            useEffect(() => {
                const onKey = (event) => {
                    if (event.key === 'Escape') { setIsDrawing(false); setIsDrawMode(false); }
                    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
                        if (historyRef.current.length > 0) {
                            playPop();
                            const lastState = historyRef.current.pop();
                            const canvas = canvasRef.current;
                            canvas.getContext('2d').putImageData(lastState, 0, 0);
                            savedImageRef.current = lastState;
                        }
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            const clearCanvas = () => {
                playPop();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
            };

            const colors = [
                { name: 'Rojo', hex: '#ef4444', tw: 'bg-[#ef4444]' },
                { name: 'Negro', hex: '#0f172a', tw: 'bg-[#0f172a]' },
                { name: 'Azul', hex: '#3b82f6', tw: 'bg-[#3b82f6]' },
                { name: 'Verde', hex: '#22c55e', tw: 'bg-[#22c55e]' },
                { name: 'Amarillo', hex: '#facc15', tw: 'bg-[#facc15]' }
            ];

            return (
                <>
                    <div style={{zIndex: 120, pointerEvents: 'auto'}} className="absolute top-2 right-2 flex flex-wrap max-w-[calc(100%-1rem)] justify-end gap-2 pointer-events-auto bg-white/80 p-1.5 rounded-xl backdrop-blur-sm shadow-md border border-slate-200">
                        <button onClick={() => selectTool('selector')} aria-pressed={!isDrawMode} title="Seleccionar (Esc)" className={`px-3 py-1.5 text-xs sm:text-sm font-black rounded-lg border-2 shadow-sm transition-all ${!isDrawMode ? 'bg-cyan-500 text-white border-cyan-600' : 'bg-white text-slate-600 border-slate-300'}`}>🖱️ Selector</button>
                        <button onClick={() => selectTool('pen')} className={`px-3 py-1.5 text-xs sm:text-sm font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'pen' ? 'bg-indigo-500 text-white border-indigo-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖊️ Lápiz</button>
                        <button onClick={() => selectTool('highlighter')} className={`px-3 py-1.5 text-xs sm:text-sm font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'highlighter' ? 'bg-yellow-400 text-slate-900 border-yellow-500 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖍️ Resaltador</button>
                        {isDrawMode && tool === 'pen' && (
                            <label className="flex items-center gap-2 px-2 py-1 rounded-lg bg-white border-2 border-indigo-200 text-xs font-black text-slate-700">
                                Grosor <input type="range" min="3" max="16" step="1" value={penWidth} onChange={e => setPenWidth(Number(e.target.value))} className="w-20 accent-indigo-600" />
                            </label>
                        )}
                        {isDrawMode && (
                            <>
                                <button onClick={() => { playPop(); setIsSnapMode(!isSnapMode); }} className={`px-3 py-1.5 text-xs sm:text-sm font-black rounded-lg border-2 shadow-sm transition-all ${isSnapMode ? 'bg-blue-500 text-white border-blue-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>📐 Recto</button>
                                <button onClick={clearCanvas} className="px-3 py-1.5 text-xs sm:text-sm font-black bg-white text-rose-600 border-2 border-rose-300 rounded-lg shadow-sm hover:bg-rose-50 active:scale-95 transition-all">🗑️ Limpiar</button>
                                <div className="px-2 py-1.5 text-xs font-bold text-slate-400 flex items-center bg-white rounded-lg border border-slate-200">CTRL+Z: Deshacer</div>
                            </>

                    </div>
                    {isDrawMode && (
                        <div className="absolute top-1/2 right-4 -translate-y-1/2 z-[110] flex flex-col gap-2 p-1.5 bg-white/90 backdrop-blur-md rounded-xl border-[3px] border-slate-200 shadow-xl pointer-events-auto">

                                <button key={c.hex} onClick={() => { playPop(); setPenColor(c.hex); }} className={`w-5 h-5 sm:w-6 sm:h-6 rounded-full border-[3px] shadow-sm transition-all hover:scale-110 active:scale-95 ${c.tw} ${penColor === c.hex ? 'border-white outline outline-[3px] outline-slate-800 scale-110' : 'border-black/20'}`} />
                            ))}
                        </div>
                    )}
                    <canvas ref={canvasRef} style={{ zIndex: 100, pointerEvents: isDrawMode ? 'auto' : 'none', touchAction: isDrawMode ? 'none' : 'auto' }} className={`absolute inset-0 z-[100] touch-none ${isDrawMode ? 'cursor-crosshair pointer-events-auto' : 'pointer-events-none'}`} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={e => { if (activePointerRef.current === e.pointerId) { draw(e); stopDrawing(); } }} onPointerLeave={e => { if (!e.currentTarget.hasPointerCapture(e.pointerId)) stopDrawing(); }} onLostPointerCapture={stopDrawing} onPointerCancel={stopDrawing} />
                </>
            );
        };

        const ThermalChart = memo(({ config }) => {
            if (!config) return (
                <div className="w-full h-full min-h-[200px] flex flex-col items-center justify-center text-slate-400 opacity-60">

                    <p className="font-bold text-center text-xl">El monitor térmico se encenderá<br/>al iniciar los cálculos...</p>
                </div>
            );

            const { type, T1, T2, TE, Q1, Q2, instant } = config;
            const x0 = 100, x1 = 800, baseline = 180;
            
            const drawArc = (startX, endX, isGain) => {
                const midX = (startX + endX) / 2;
                const height = isGain ? 80 : 120;
                return `M ${startX} ${baseline} Q ${midX} ${baseline - height * 2} ${endX} ${baseline}`;
            };

            return (
                <div className="w-full h-full flex flex-col items-center justify-center px-1">
                    <div className="text-center text-sm sm:text-base font-black text-cyan-400 mb-4 uppercase drop-shadow-[0_0_8px_rgba(6,182,212,0.8)] tracking-widest z-10">
                        {type === 'equilibrio' ? '» Monitor de Equilibrio Térmico «' : '» Escáner de Calor Sensible «'}
                    </div>
                    <svg viewBox="0 0 900 300" className="w-full max-h-full z-10" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
                            </pattern>

                            <radialGradient id="sphere-hot" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stopColor="#fca5a5" />
                                <stop offset="50%" stopColor="#ef4444" />
                                <stop offset="100%" stopColor="#7f1d1d" />
                            </radialGradient>
                            <radialGradient id="sphere-cold" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stopColor="#93c5fd" />
                                <stop offset="50%" stopColor="#3b82f6" />
                                <stop offset="100%" stopColor="#1e3a8a" />
                            </radialGradient>
                            <radialGradient id="sphere-eq" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stopColor="#86efac" />
                                <stop offset="50%" stopColor="#22c55e" />
                                <stop offset="100%" stopColor="#14532d" />
                            </radialGradient>
                            <radialGradient id="sphere-neutral" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stopColor="#cbd5e1" />
                                <stop offset="50%" stopColor="#64748b" />
                                <stop offset="100%" stopColor="#0f172a" />
                            </radialGradient>

                            <linearGradient id="grad-gana" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#ef4444" />
                                <stop offset="100%" stopColor="#f59e0b" />
                            </linearGradient>
                            <linearGradient id="grad-pierde" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#3b82f6" />
                                <stop offset="100%" stopColor="#06b6d4" />
                            </linearGradient>
                            <linearGradient id="grad-sensible" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#facc15" />
                                <stop offset="100%" stopColor="#ef4444" />
                            </linearGradient>
                            
                            <filter id="glow-svg" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="6" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <rect x="0" y="0" width="100%" height="100%" fill="url(#grid)" rx="20" />

                        <line x1="40" x2="860" y1={baseline} y2={baseline} stroke="#475569" strokeWidth="4" strokeLinecap="round" filter="url(#glow-svg)" />
                        <path d={`M 875 ${baseline} l -15 -8 v 16 Z`} fill="#94a3b8" filter="url(#glow-svg)"/>
                        <text x="860" y={baseline + 45} fontSize="22" fontWeight="900" fill="#94a3b8">T(°C)</text>

                        {type === 'equilibrio' && (
                            <>
                                {T1 !== undefined && TE !== undefined && (
                                    <g opacity={instant ? 1 : 0} style={{animation: instant ? 'none' : 'signFade 0.5s ease-out 0.2s forwards'}}>
                                        <path d={drawArc(x0, 450, true)} fill="none" stroke="url(#grad-gana)" filter="url(#glow-svg)" strokeWidth="7" strokeLinecap="round" strokeDasharray="15 10" style={{animation: 'dashFlow 1s linear infinite'}} />
                                        <text x={(x0 + 450)/2} y={baseline - 100} fontSize="26" fontWeight="900" fill="#fca5a5" filter="url(#glow-svg)" textAnchor="middle">Q gana</text>
                                    </g>
                                )}
                                {T2 !== undefined && TE !== undefined && (
                                    <g opacity={instant ? 1 : 0} style={{animation: instant ? 'none' : 'signFade 0.5s ease-out 0.6s forwards'}}>
                                        <path d={drawArc(450, x1, false)} fill="none" stroke="url(#grad-pierde)" filter="url(#glow-svg)" strokeWidth="7" strokeLinecap="round" strokeDasharray="15 10" style={{animation: 'dashFlow 1s linear infinite reverse'}} />
                                        <text x={(450 + x1)/2} y={baseline - 140} fontSize="26" fontWeight="900" fill="#93c5fd" filter="url(#glow-svg)" textAnchor="middle">Q pierde</text>
                                    </g>
                                )}
                                
                                {[ {t: T1, x: x0, fill: 'url(#sphere-hot)'}, {t: TE, x: 450, fill: 'url(#sphere-eq)'}, {t: T2, x: x1, fill: 'url(#sphere-cold)'} ].map((pt, i) => pt.t !== undefined && (
                                    <g key={`pt-${i}`} opacity={instant ? 1 : 0} style={{animation: instant ? 'none' : `signAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) ${i*0.2}s forwards`}}>
                                        <circle cx={pt.x} cy={baseline} r="16" fill={pt.fill} filter="url(#glow-svg)" stroke="#fff" strokeWidth="2" />
                                        <text x={pt.x} y={baseline + 45} fontSize="30" fontWeight="900" textAnchor="middle" fill="#ffffff" filter="url(#glow-svg)">{pt.t}°</text>
                                    </g>
                                ))}
                            </>
                        )}

                        {type === 'sensible' && (
                            <>
                                <g opacity={instant ? 1 : 0} style={{animation: instant ? 'none' : 'signFade 0.5s ease-out 0.4s forwards'}}>
                                    <path d={drawArc(x0, x1, true)} fill="none" stroke="url(#grad-sensible)" filter="url(#glow-svg)" strokeWidth="8" strokeLinecap="round" strokeDasharray="20 15" style={{animation: 'dashFlow 1.2s linear infinite'}} />
                                    <text x={450} y={baseline - 110} fontSize="32" fontWeight="900" fill="#fde047" filter="url(#glow-svg)" textAnchor="middle">Q = {Q1}</text>
                                </g>
                                {[ {t: T1, x: x0}, {t: T2, x: x1} ].map((pt, i) => pt.t !== undefined && (
                                    <g key={`sens-${i}`} opacity={instant ? 1 : 0} style={{animation: instant ? 'none' : `signAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) ${i*0.2}s forwards`}}>
                                        <circle cx={pt.x} cy={baseline} r="16" fill="url(#sphere-neutral)" filter="url(#glow-svg)" stroke="#e2e8f0" strokeWidth="2" />
                                        <text x={pt.x} y={baseline + 45} fontSize="30" fontWeight="900" textAnchor="middle" fill="#f8fafc" filter="url(#glow-svg)">{pt.t}°</text>
                                    </g>
                                ))}
                            </>
                        )}
                    </svg>
                </div>
            );
        });

        // 15 Ejercicios de Calorimetría
        const EXERCISES = [
            { id: 1, title: "Ejercicio 1", subtitle: "Calor Sensible: Hierro",
              cardGradient: "from-blue-500/30 to-cyan-600/30 border-blue-400", badgeColor: "bg-blue-500",
              enunciado: () => <span>¿Cuánto calor, en cal, se debe proporcionar a un trozo de hierro de 50 g para elevar su temperatura de 10°C a 110°C? <MathDisplay inline latex="(c = 0,12 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`Q = m \cdot c \cdot \Delta T`, propertyText: "Fórmula", robotSpeech: "¡Empezamos con hierro! Usamos la fórmula principal del calor sensible." },
                  { latex: String.raw`Q = (50)(0.12)(110 - 10)`, propertyText: "Reemplazo", robotSpeech: "Reemplazamos masa, calor específico y temperaturas." },
                  { latex: String.raw`Q = (50)(0.12)(100)`, propertyText: "Variación", robotSpeech: "La variación térmica es de 100 grados Celsius exactos." },
                  { latex: String.raw`Q = 600 \text{ cal}`, propertyText: "Resultado", robotSpeech: "¡Genial! 600 calorías es la energía térmica total que requiere.", graphic: { type: 'sensible', T1: 10, T2: 110, Q1: '600 cal' } }
              ]
            },
            { id: 2, title: "Ejercicio 2", subtitle: "Calor Sensible: Aluminio",
              cardGradient: "from-cyan-500/30 to-teal-600/30 border-cyan-400", badgeColor: "bg-cyan-500",
              enunciado: () => <span>¿Cuánto calor, en cal, se debe proporcionar a un trozo de aluminio de 100 g para elevar su temperatura de 10°C a 60°C? <MathDisplay inline latex="(c = 0,3 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`\Delta T = 60 - 10 = 50^\circ C`, propertyText: "Variación", robotSpeech: "El aluminio requiere más calor. ¡Primero calculemos el Delta de T!" },
                  { latex: String.raw`Q = (100)(0.3)(50)`, propertyText: "Fórmula", robotSpeech: "Multiplicamos 100g de masa por 0.3 y por los 50 grados." },
                  { latex: String.raw`Q = 1500 \text{ cal}`, propertyText: "Resultado", robotSpeech: "¡Fácil! 1500 calorías transferidas al metal.", graphic: { type: 'sensible', T1: 10, T2: 60, Q1: '1500 cal' } }
              ]
            },
            { id: 3, title: "Ejercicio 3", subtitle: "Calor Sensible: Cobre",
              cardGradient: "from-teal-500/30 to-emerald-600/30 border-teal-400", badgeColor: "bg-teal-500",
              enunciado: () => <span>¿Cuánto calor, en cal, se debe proporcionar a un trozo de cobre de 500 g para elevar su temperatura de 20°C a 90°C? <MathDisplay inline latex="(c = 0,1 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`\Delta T = 90 - 20 = 70^\circ C`, propertyText: "Variación", robotSpeech: "El cobre incrementará su temperatura en 70 grados Celsius." },
                  { latex: String.raw`Q = (500)(0.1)(70)`, propertyText: "Ecuación", robotSpeech: "Sustituimos la masa de 500g y el calor específico de 0.1." },
                  { latex: String.raw`Q = 3500 \text{ cal}`, propertyText: "Resultado", robotSpeech: "El resultado son 3500 calorías necesarias para calentar el cobre.", graphic: { type: 'sensible', T1: 20, T2: 90, Q1: '3500 cal' } }
              ]
            },
            { id: 4, title: "Ejercicio 4", subtitle: "Calculando la Masa",
              cardGradient: "from-emerald-500/30 to-green-600/30 border-emerald-400", badgeColor: "bg-emerald-500",
              enunciado: () => <span>Calcula la masa, en g, de un bloque de plomo que absorbe 200 cal y aumenta su temperatura de 60°C a 100°C. <MathDisplay inline latex="(c = 0,25 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`Q = m \cdot c \cdot \Delta T`, propertyText: "Fórmula", robotSpeech: "Aquí tenemos el calor y necesitamos despejar la masa." },
                  { latex: String.raw`200 = m(0.25)(100 - 60)`, propertyText: "Sustitución", robotSpeech: "Colocamos las 200 calorías y la variación de temperatura." },
                  { latex: String.raw`200 = m(0.25)(40)`, propertyText: "Resta", robotSpeech: "La variación térmica neta es de 40 grados." },
                  { latex: String.raw`200 = 10m \implies m = 20 \text{ g}`, propertyText: "Despeje Final", robotSpeech: "Al dividir, descubrimos que el bloque de plomo tiene 20 gramos de masa.", graphic: { type: 'sensible', T1: 60, T2: 100, Q1: '200 cal' } }
              ]
            },
            { id: 5, title: "Ejercicio 5", subtitle: "Temperatura Final",
              cardGradient: "from-green-500/30 to-lime-600/30 border-green-400", badgeColor: "bg-green-500",
              enunciado: () => <span>Un bloque de plata de 0,5 kg se encuentra a 17°C y absorbe 600 cal. ¿Cuál será su temperatura final, en °C? <MathDisplay inline latex="(c = 0,6 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`m = 0.5 \text{ kg} = 500 \text{ g}`, propertyText: "Conversión", robotSpeech: "Siempre debes pasar los kg a gramos para que coincida con el calor específico." },
                  { latex: String.raw`600 = (500)(0.6)(T_f - 17)`, propertyText: "Planteo", robotSpeech: "Esta vez nuestra incógnita se esconde dentro de la variación de temperatura." },
                  { latex: String.raw`600 = 300(T_f - 17)`, propertyText: "Multiplicar", robotSpeech: "Operamos 500 por 0.6." },
                  { latex: String.raw`2 = T_f - 17 \implies T_f = 19^\circ C`, propertyText: "Solución", robotSpeech: "Pasamos dividiendo el 300 y sumamos 17. ¡La temperatura final es de 19°C!", graphic: { type: 'sensible', T1: 17, T2: 19, Q1: '600 cal' } }
              ]
            },
            { id: 6, title: "Ejercicio 6", subtitle: "Temperatura Final II",
              cardGradient: "from-lime-500/30 to-yellow-600/30 border-lime-400", badgeColor: "bg-lime-500",
              enunciado: () => <span>Un bloque de oro de 2 kg se encuentra a 8°C y absorbe 240 cal. ¿Cuál será su temperatura final, en °C? <MathDisplay inline latex="(c = 0,03 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`240 = (2000)(0.03)(T_f - 8)`, propertyText: "Ecuación", robotSpeech: "Convertimos los 2kg a 2000g directamente en nuestra ecuación general." },
                  { latex: String.raw`240 = 60(T_f - 8)`, propertyText: "Simplificar", robotSpeech: "Multiplicamos 2000 por 0.03, dándonos una constante de 60." },
                  { latex: String.raw`4 = T_f - 8 \implies T_f = 12^\circ C`, propertyText: "Resultado", robotSpeech: "¡Listo! 240 dividido 60 es 4. El oro termina en 12°C.", graphic: { type: 'sensible', T1: 8, T2: 12, Q1: '240 cal' } }
              ]
            },
            { id: 7, title: "Ejercicio 7", subtitle: "Variación Térmica",
              cardGradient: "from-yellow-500/30 to-amber-600/30 border-yellow-400", badgeColor: "bg-yellow-500",
              enunciado: () => <span>A un cuerpo de 100 g, cuyo calor específico es 0,5 cal/(g·°C), se le entregan 400 cal. ¿En cuántos grados Celsius se elevará su temperatura?</span>,
              steps: [
                  { latex: String.raw`Q = m \cdot c \cdot \Delta T`, propertyText: "Fórmula", robotSpeech: "Nos piden la variación total, así que dejaremos 'Delta T' juntito." },
                  { latex: String.raw`400 = (100)(0.5)\cdot \Delta T`, propertyText: "Reemplazo", robotSpeech: "Reemplazamos el calor aportado, la masa y el calor específico." },
                  { latex: String.raw`400 = 50 \cdot \Delta T \implies \Delta T = 8^\circ C`, propertyText: "Solución", robotSpeech: "Dividimos y concluimos que el bloque elevará su temperatura exactamente 8 grados.", graphic: { type: 'sensible', T1: 'T', T2: 'T+8', Q1: '400 cal' } }
              ]
            },
            { id: 8, title: "Ejercicio 8", subtitle: "Equilibrio: Hallar Masa",
              cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400", badgeColor: "bg-amber-500",
              enunciado: () => <span>Un bloque de aluminio a 120°C se sumerge en 900 g de agua a 10°C. Si la temperatura de equilibrio es 20°C, calcula la masa del bloque, en g. <MathDisplay inline latex="(c_{Al} = 0,9 \text{ cal/g}\cdot^\circ\text{C})" /></span>,
              steps: [
                  { latex: String.raw`Q_{\text{gana}} = Q_{\text{pierde}}`, propertyText: "Conservación", robotSpeech: "¡Entramos a mezclas! El calor que gana el agua fría proviene del aluminio caliente." },
                  { latex: String.raw`900(1)(20 - 10) = m(0.9)(120 - 20)`, propertyText: "Balances", robotSpeech: "Armamos la ecuación de equilibrio asegurándonos de restar siempre Mayor menos Menor." },
                  { latex: String.raw`900(10) = m(0.9)(100)`, propertyText: "Restas", robotSpeech: "Calculamos los cambios de temperatura de ambos elementos." },
                  { latex: String.raw`9000 = 90m \implies m = 100 \text{ g}`, propertyText: "Despeje", robotSpeech: "Dividimos 9000 entre 90 y averiguamos que la pieza de aluminio tenía 100 gramos.", graphic: { type: 'equilibrio', T1: 10, T2: 120, TE: 20 } }
              ]
            },
            { id: 9, title: "Ejercicio 9", subtitle: "Análisis Crítico",
              cardGradient: "from-orange-500/30 to-rose-600/30 border-orange-400", badgeColor: "bg-orange-500",
              enunciado: () => <span>Un bloque de aluminio a 80°C se sumerge en 180 g de agua a 60°C. El enunciado indica una temperatura de equilibrio de 20°C y pide la masa. Determina la inconsistencia.</span>,
              steps: [
                  { latex: String.raw`T_{final} (20^\circ C) < T_{iniciales} (60^\circ C, 80^\circ C)`, propertyText: "Concepto", robotSpeech: "¡Cuidado! Analicemos bien este caso. La temperatura final no puede ser menor a las iniciales." },
                  { latex: String.raw`Q_{Al} + Q_{agua} = 0`, propertyText: "Forzando", robotSpeech: "Si forzamos el cálculo matemático sumando algebraicamente y asumiendo calor cedido, veremos el error." },
                  { latex: String.raw`m(0.9)(20-80) + 180(1)(20-60) = 0`, propertyText: "Operación", robotSpeech: "Planteamos la ecuación cruda con los signos que arrojen las restas." },
                  { latex: String.raw`-54m - 7200 = 0 \implies m = -133.3 \text{ g}`, propertyText: "Absurdo", robotSpeech: "¡Masa negativa! Físicamente absurdo. Es una inconsistencia del planteamiento original.", graphic: { type: 'equilibrio', T1: 60, T2: 80, TE: "20(Error)" } }
              ]
            },
            { id: 10, title: "Ejercicio 10", subtitle: "Metal Desconocido",
              cardGradient: "from-rose-500/30 to-pink-600/30 border-rose-400", badgeColor: "bg-rose-500",
              enunciado: () => <span>Un recipiente contiene 1,5 kg de agua a 20°C. Se introduce un metal de 3,00 kg a 130 °C y la temperatura de equilibrio es 40°C. ¿Cuál es el calor específico del metal?</span>,
              steps: [
                  { latex: String.raw`Q_{agua} = Q_{metal}`, propertyText: "Principio", robotSpeech: "Igualamos energías térmicas transadas en el calorímetro." },
                  { latex: String.raw`1500(1)(40 - 20) = 3000(c_{met})(130 - 40)`, propertyText: "Ecuación", robotSpeech: "Recuerda transformar 1.5kg a 1500g y 3kg a 3000g." },
                  { latex: String.raw`1500(20) = 3000(c_{met})(90)`, propertyText: "Deltas", robotSpeech: "Calculamos las restas de temperatura en ambos costados." },
                  { latex: String.raw`30000 = 270000 \cdot c_{met}`, propertyText: "Multiplicar", robotSpeech: "Efectuamos el producto en las expresiones lineales." },
                  { latex: String.raw`c_{met} = \frac{1}{9} \approx 0.111 \text{ cal/g}^\circ\text{C}`, propertyText: "Resultado", robotSpeech: "El calor específico es 1/9. Por el valor, ¡seguramente es acero o hierro!", graphic: { type: 'equilibrio', T1: 20, T2: 130, TE: 40 } }
              ]
            },
            { id: 11, title: "Ejercicio 11", subtitle: "Mezcla de Agua en Kg",
              cardGradient: "from-pink-500/30 to-fuchsia-600/30 border-pink-400", badgeColor: "bg-pink-500",
              enunciado: () => <span>Determina cuántos kilogramos de agua a 5°C deben mezclarse con 20 kg de agua a 75°C para obtener agua a 30°C. <MathDisplay inline latex="(c_{H_2O} = 1)" /></span>,
              steps: [
                  { latex: String.raw`m_1(1)(30 - 5) = 20(1)(75 - 30)`, propertyText: "Ecuación", robotSpeech: "Truco pro: Como ambas sustancias son agua, sus capacidades se cancelan y podemos usar 'kg' de frente." },
                  { latex: String.raw`m_1(25) = 20(45)`, propertyText: "Deltas", robotSpeech: "Calculamos que el agua fría aumenta 25°C y la caliente baja 45°C." },
                  { latex: String.raw`25 m_1 = 900`, propertyText: "Operar", robotSpeech: "Multiplicamos 20 por 45 en el lado derecho." },
                  { latex: String.raw`m_1 = 36 \text{ kg}`, propertyText: "Despeje", robotSpeech: "Para estabilizar el sistema necesitas 36 kilogramos de agua helada.", graphic: { type: 'equilibrio', T1: 5, T2: 75, TE: 30 } }
              ]
            },
            { id: 12, title: "Ejercicio 12", subtitle: "Mezcla Clásica",
              cardGradient: "from-fuchsia-500/30 to-purple-600/30 border-fuchsia-400", badgeColor: "bg-fuchsia-500",
              enunciado: () => <span>Se mezclan 100 g de agua a 10°C con 300 g de agua a 90°C. ¿Cuál será la temperatura de equilibrio de la mezcla?</span>,
              steps: [
                  { latex: String.raw`100(1)(T_e - 10) = 300(1)(90 - T_e)`, propertyText: "Igualdad", robotSpeech: "Establecemos el principio universal de conservación de energía para el agua." },
                  { latex: String.raw`1(T_e - 10) = 3(90 - T_e)`, propertyText: "Simplificar", robotSpeech: "Extraemos dos ceros (dividimos por cien) para aliviar los cálculos mentales." },
                  { latex: String.raw`T_e - 10 = 270 - 3T_e`, propertyText: "Distribuir", robotSpeech: "Expandimos el paréntesis distribuyendo el múltiplo '3'." },
                  { latex: String.raw`4T_e = 280 \implies T_e = 70^\circ C`, propertyText: "Final", robotSpeech: "Agrupamos variables. ¡El agua tibia final rondará los 70°C!", graphic: { type: 'equilibrio', T1: 10, T2: 90, TE: 70 } }
              ]
            },
            { id: 13, title: "Ejercicio 13", subtitle: "Mezcla Clásica II",
              cardGradient: "from-purple-500/30 to-violet-600/30 border-purple-400", badgeColor: "bg-purple-500",
              enunciado: () => <span>Un recipiente de capacidad calorífica despreciable contiene 100 g de agua a 20°C. Se vierten 500 g de agua a 80°C. Determina la temperatura de equilibrio.</span>,
              steps: [
                  { latex: String.raw`100(T_e - 20) = 500(80 - T_e)`, propertyText: "Planteo", robotSpeech: "Nuevamente, omitimos el calor específico pues '1' no cambia los productos." },
                  { latex: String.raw`T_e - 20 = 5(80 - T_e)`, propertyText: "Simplificar", robotSpeech: "Dividimos por 100 a izquierda y derecha de la ecuación." },
                  { latex: String.raw`T_e - 20 = 400 - 5T_e`, propertyText: "Distribuir", robotSpeech: "La masa caliente multiplicará por cinco su impacto térmico." },
                  { latex: String.raw`6T_e = 420 \implies T_e = 70^\circ C`, propertyText: "Final", robotSpeech: "La gran cantidad de agua caliente arrastró el equilibrio a 70 grados.", graphic: { type: 'equilibrio', T1: 20, T2: 80, TE: 70 } }
              ]
            },
            { id: 14, title: "Ejercicio 14", subtitle: "Sistema de 3 Cuerpos",
              cardGradient: "from-violet-500/30 to-indigo-600/30 border-violet-400", badgeColor: "bg-violet-500",
              enunciado: () => <span>Un recipiente de aluminio de 0,5 kg contiene 110 g de agua; ambos están a 20°C. Se introduce hierro de 200 g a 75°C. Calcula la temperatura final. <MathDisplay inline latex="(c_{Al}=0.22 \text{ ; } c_{Fe}=0.11)" /></span>,
              steps: [
                  { latex: String.raw`C_{\text{frio}} = 500(0.22) + 110(1)`, propertyText: "Agrupar Fríos", robotSpeech: "¡Reto triple! El recipiente de Aluminio absorbe calor, así que sumaremos su capacidad con la del agua." },
                  { latex: String.raw`C_{\text{frio}} = 110 + 110 = 220 \text{ cal/}^\circ C`, propertyText: "Cálculo", robotSpeech: "El sistema frío opera como un super-cuerpo único con capacidad 220." },
                  { latex: String.raw`220(T_e - 20) = 200(0.11)(75 - T_e)`, propertyText: "Igualdad", robotSpeech: "Igualamos el calor ganado por el grupo frío con el perdido por el bloque de Hierro." },
                  { latex: String.raw`220(T_e - 20) = 22(75 - T_e)`, propertyText: "Simplificar", robotSpeech: "Multiplicamos 200 por 0.11 para simplificar el costado derecho." },
                  { latex: String.raw`10T_e - 200 = 75 - T_e \implies 11T_e = 275`, propertyText: "Distribuir", robotSpeech: "Dividimos por 22 y despejamos términos similares." },
                  { latex: String.raw`T_e = 25^\circ C`, propertyText: "Solución", robotSpeech: "¡Misterio resuelto! La temperatura general de todo el conjunto terminará en 25°C.", graphic: { type: 'equilibrio', T1: 20, T2: 75, TE: 25 } }
              ]
            },
            { id: 15, title: "Ejercicio 15", subtitle: "Capacidad de Aleación",
              cardGradient: "from-indigo-500/30 to-blue-600/30 border-indigo-400", badgeColor: "bg-indigo-500",
              enunciado: () => <span>Una aleación: Cu(200g, c=0.094), Sn(150g, c=0.055) y Al(80g, c=0.212). Calcula: a) Su capacidad calorífica; b) El calor para subir 50°C.</span>,
              steps: [
                  { latex: String.raw`C_{tot} = m_{Cu}c_{Cu} + m_{Sn}c_{Sn} + m_{Al}c_{Al}`, propertyText: "Fórmula", robotSpeech: "¡Una aleación de 3 metales! Su capacidad calorífica total será la sumatoria de sus partes." },
                  { latex: String.raw`C_{tot} = (200)(0.094) + (150)(0.055) + (80)(0.212)`, propertyText: "Reemplazo", robotSpeech: "Sustituimos cuidadosamente los gramos y calores específicos brindados." },
                  { latex: String.raw`C_{tot} = 18.8 + 8.25 + 16.96`, propertyText: "Sumatoria", robotSpeech: "Calculamos cada contribución térmica individual del Cobre, Estaño y Aluminio." },
                  { latex: String.raw`C_{tot} = 44.01 \text{ cal/}^\circ C`, propertyText: "Respuesta A", robotSpeech: "Esta es la inercia térmica global. Por cada grado Celsius, el metal completo exigirá 44.01 cal." },
                  { latex: String.raw`Q = 44.01 \times 50 = 2200.5 \text{ cal}`, propertyText: "Respuesta B", robotSpeech: "Multiplicamos la capacidad total por los 50 grados, ¡obteniendo las calorías definitivas!", graphic: { type: 'sensible', T1: 'T', T2: 'T+50', Q1: '2200.5 cal' } }
              ]
            }
        ];

        const FloatingBackground = memo(() => {
            const symbols = ['🌡️', '🔥', 'T', 'Q', 'm', 'c', 'ΔT', '+', '-'];
            const elements = Array.from({ length: 30 }).map((_, i) => ({
                id: i, symbol: symbols[Math.floor(Math.random() * symbols.length)], left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`, animationDelay: `-${Math.random() * 20}s`,
                fontSize: `${1 + Math.random() * 3}rem`, opacity: 0.1 + Math.random() * 0.15
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none drop-shadow-lg" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>

        const Confetti = memo(() => {
            const colors = ['#fde047', '#60a5fa', '#f472b6', '#34d399', '#a78bfa', '#ff5722'];

            }));
            return (

                    ))}
                </div>

        });

        const RobotAssistant = ({ step, maxSteps }) => {
            const isFinalStep = step >= maxSteps;

            const getContainerAnim = () => { if (isFinalStep) return 'animate-robotJump'; if (isThinking) return 'animate-robotThinkTilt'; return 'animate-robotFloat'; };
            const getArmLAnim = () => { if (isFinalStep) return 'rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmL'; return 'rotate-45'; };
            const getArmRAnim = () => { if (isFinalStep) return '-rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmR'; return '-rotate-45'; };
            
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1"><div className="w-2.5 h-1.5 bg-emerald-400 rounded-t-full mt-0.5"></div><div className="w-2.5 h-1.5 bg-emerald-400 rounded-t-full mt-0.5"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-1.5"><div className="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1"><div className="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };

                return <div className="w-2.5 h-2.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-[0_0_15px_rgba(99,102,241,0.5)] select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>

                AudioController.init();

                for (let i = step; i >= 0; i--) {

                return graphic;

                setExIdx(index); setStep(0); setView('lab');

                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next); AudioController.play(next === maxSteps ? 'success' : 'pop');

                }

            const prevStep = () => {

                            <p className="text-base sm:text-xl lg:text-2xl text-purple-100 mb-8 sm:mb-12 font-bold max-w-3xl leading-relaxed">

                            <div className="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-12">
                                {EXERCISES.map((ex, idx) => (
                                    <button key={ex.id} onClick={() => startExercise(idx)} className="group text-left p-4 sm:p-5 rounded-[1.5rem] bg-gradient-to-br bg-opacity-90 backdrop-blur-xl border-[3px] border-white/20 hover:-translate-y-2 hover:border-white/60 hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all duration-300 flex flex-col relative overflow-hidden shadow-lg min-h-[10rem] sm:min-h-[12rem]" style={{ backgroundImage: `linear-gradient(to bottom right, var(--tw-gradient-stops))` }}>

                                            <div className="text-white text-sm sm:text-base font-black text-center mt-2 drop-shadow-md">{ex.subtitle}</div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <FloatingBackground />

                            <Home className="w-5 h-5 sm:mr-2" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1.5 sm:gap-2 bg-black/30 p-1.5 sm:p-2 rounded-[1rem] sm:rounded-[1.2rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[50vw]">

                                                {idx === step && <Sparkles className="w-4 h-4" />}

                                        <div className={`w-full text-left rounded-2xl flex items-center justify-center min-h-[5.5rem] px-3 overflow-hidden whitespace-nowrap transition-all duration-500 ${

                                <h3 className="absolute top-4 left-4 font-black text-slate-500 uppercase tracking-widest text-xs sm:text-sm flex items-center gap-1 z-20">
                                    <Activity className="w-4 h-4 sm:w-5 sm:h-5 text-cyan-500"/> Escáner Visual
                                </h3>
                                <div className="w-full h-full bg-[#0b1120] border-[2px] border-slate-800 rounded-[2rem] p-2 sm:p-4 flex items-center justify-center shadow-[inset_0_0_50px_rgba(0,0,0,0.8),0_0_20px_rgba(6,182,212,0.1)] relative overflow-hidden pointer-events-auto group">
                                    <div className="absolute inset-0 bg-gradient-to-br from-cyan-500/5 to-purple-500/5 opacity-50 group-hover:opacity-100 transition-opacity duration-1000"></div>
                                    <ThermalChart key={`${exIdx}-${step}`} config={getCurrentGraphic()} />
                                </div>
                            </div>

                            <DrawingCanvas />
                        </div>

                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-8 sm:py-3 flex items-center gap-4 sm:gap-6 border-t-[4px] border-slate-100 z-30 relative shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                            <div className="shrink-0 absolute -top-10 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl z-50">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-xs sm:text-sm md:text-base font-bold text-slate-700 leading-snug sm:leading-relaxed bg-blue-50/80 p-2 sm:p-3 rounded-[1rem] border-2 border-blue-100 min-h-[3rem] flex items-center shadow-sm ml-[3.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {curStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        <div className="shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-3 w-full flex flex-col items-center border-t-[4px] border-white z-40">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-4 h-8 sm:h-10">
                                <button onClick={prevStep} disabled={step === 0} className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]">
                                    <ChevronLeft className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>
                                <div className="bg-[#6366f1] text-white font-black px-2 sm:px-4 text-xs sm:text-sm flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[3rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>
                                <button onClick={nextStep} className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                    step === maxSteps ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse' : 'bg-gradient-to-r from-[#06b6d4] to-[#0284c7] border-[#0369a1]'
                                }`}>
                                    <span>{step < maxSteps ? '¡Siguiente Paso!' : exIdx < EXERCISES.length - 1 ? `Siguiente Reto` : '¡Volver!'}</span>
                                    <ChevronRight className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
